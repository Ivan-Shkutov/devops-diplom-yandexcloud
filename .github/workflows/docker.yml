name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"


# -------------------------
# 1. CHECKOUT
# -------------------------
jobs:

  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


# -------------------------
# 2. BUILD IMAGE
# -------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build latest
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/test-app:latest ./cicd/app

      - name: Save image name
        run: echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/test-app:latest" >> $GITHUB_ENV


# -------------------------
# 3. PUSH LATEST
# -------------------------
  push_latest:
    name: Push Latest Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push latest
        run: docker push ${{ secrets.DOCKER_USERNAME }}/test-app:latest


# -------------------------
# 4. BUILD TAG (ONLY TAGS)
# -------------------------
  build_tag:
    name: Build Tagged Image
    runs-on: ubuntu-latest
    needs: push_latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build tag image
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/test-app:$TAG ./cicd/app


# -------------------------
# 5. PUSH TAG
# -------------------------
  push_tag:
    name: Push Tagged Image
    runs-on: ubuntu-latest
    needs: build_tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker push ${{ secrets.DOCKER_USERNAME }}/test-app:$TAG


# -------------------------
# 6. DEPLOY (SSH → MASTER)
# -------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push_tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |

            TAG=${GITHUB_REF#refs/tags/}

            echo "Pull image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/test-app:$TAG

            echo "Deploy to Kubernetes..."
            kubectl set image deployment/nginx-deployment \
              nginx-deployment=${{ secrets.DOCKER_USERNAME }}/test-app:$TAG

            kubectl rollout status deployment/nginx-deployment
