name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build latest image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/test-app:latest ./cicd/app

      - name: Push latest
        run: docker push ${{ secrets.DOCKER_USERNAME }}/test-app:latest

      - name: Build tagged image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/test-app:$TAG ./cicd/app

      - name: Push tagged image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker push ${{ secrets.DOCKER_USERNAME }}/test-app:$TAG


  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy application (safe apply)
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # создаём/обновляем ресурсы
          kubectl apply -f cicd/k8s/configmap/
          kubectl apply -f cicd/k8s/deployment/

          # гарантируем rollout
          kubectl set image deployment/nginx-deployment \
            nginx-deployment=${{ secrets.DOCKER_USERNAME }}/test-app:$TAG

          kubectl rollout status deployment/nginx-deployment
