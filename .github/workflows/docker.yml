name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/test-app


# -------------------------
# 1. CHECKOUT
# -------------------------
jobs:
  checkout:
    name: Checkout Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


# -------------------------
# 2. BUILD LATEST IMAGE
# -------------------------
  build_latest:
    name: Build Latest Image
    runs-on: ubuntu-latest
    needs: checkout

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build latest
        run: docker build -t $IMAGE_NAME:latest ./cicd/app

      - name: Save image
        run: docker save $IMAGE_NAME:latest -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-image
          path: image.tar


# -------------------------
# 3. PUSH LATEST
# -------------------------
  push_latest:
    name: Push Latest Image
    runs-on: ubuntu-latest
    needs: build_latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: latest-image

      - name: Load image
        run: docker load -i image.tar

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push latest
        run: docker push $IMAGE_NAME:latest


# -------------------------
# 4. BUILD TAG IMAGE
# -------------------------
  build_tag:
    name: Build Tagged Image
    runs-on: ubuntu-latest
    needs: push_latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build tag image
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t $IMAGE_NAME:$TAG ./cicd/app
          docker save $IMAGE_NAME:$TAG -o tag.tar

      - uses: actions/upload-artifact@v4
        with:
          name: tagged-image
          path: tag.tar


# -------------------------
# 5. PUSH TAG IMAGE
# -------------------------
  push_tag:
    name: Push Tagged Image
    runs-on: ubuntu-latest
    needs: build_tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tagged-image

      - name: Load image
        run: docker load -i tag.tar

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker push $IMAGE_NAME:$TAG


# -------------------------
# 6. DEPLOY TO MASTER (SSH)
# -------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push_tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            TAG=${GITHUB_REF#refs/tags/}

            kubectl set image deployment/nginx-deployment \
              nginx-deployment=$IMAGE_NAME:$TAG

            kubectl rollout status deployment/nginx-deployment
