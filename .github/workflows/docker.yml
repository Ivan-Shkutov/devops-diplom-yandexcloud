name: Docker CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/nginx-diplom:latest .

      - name: Push latest
        run: docker push ${{ secrets.DOCKER_USERNAME }}/nginx-diplom:latest

      - name: Tag image
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker tag ${{ secrets.DOCKER_USERNAME }}/nginx-diplom:latest ${{ secrets.DOCKER_USERNAME }}/nginx-diplom:$TAG

      - name: Push tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker push ${{ secrets.DOCKER_USERNAME }}/nginx-diplom:$TAG
