name: Full CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/test-app


# -------------------------
# 1. BUILD & PUSH LATEST
# -------------------------
jobs:

  build_latest:
    name: Build & Push Latest Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build latest image
        run: docker build -t $IMAGE_NAME:latest ./cicd/app

      - name: Push latest image
        run: docker push $IMAGE_NAME:latest


# -------------------------
# 2. BUILD TAG IMAGE
# -------------------------
  build_tag:
    name: Build Tagged Image
    runs-on: ubuntu-latest
    needs: build_latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build tag image
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker build -t $IMAGE_NAME:$TAG ./cicd/app
          docker push $IMAGE_NAME:$TAG


# -------------------------
# 3. DEPLOY TO KUBERNETES
# -------------------------
  deploy:
    name: Deploy to Kubernetes via SSH
    runs-on: ubuntu-latest
    needs: build_tag
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            TAG="${{ github.ref_name }}"

            echo "Deploying version: $TAG"

            kubectl set image deployment/nginx-deployment \
              nginx-deployment=${{ secrets.DOCKER_USERNAME }}/test-app:$TAG

            kubectl rollout status deployment/nginx-deployment
