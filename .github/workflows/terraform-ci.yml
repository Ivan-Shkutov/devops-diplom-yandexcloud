name: Terraform CI (split by directories)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  # =========================
  # 01 - BOOTSTRAP
  # =========================

  bootstrap-init:
    name: 01 - bootstrap init
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: diplom/infra/01-bootstrap

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init

  bootstrap-validate:
    name: 01 - bootstrap validate
    runs-on: ubuntu-latest
    needs: bootstrap-init

    defaults:
      run:
        working-directory: diplom/infra/01-bootstrap

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

  bootstrap-plan:
    name: 01 - bootstrap plan
    runs-on: ubuntu-latest
    needs: bootstrap-validate

    defaults:
      run:
        working-directory: diplom/infra/01-bootstrap

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan


  # =========================
  # 02 - NETWORK
  # =========================

  network-init:
    name: 02 - network init
    runs-on: ubuntu-latest
    needs: bootstrap-plan

    defaults:
      run:
        working-directory: diplom/infra/02-network

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init

  network-validate:
    name: 02 - network validate
    runs-on: ubuntu-latest
    needs: network-init

    defaults:
      run:
        working-directory: diplom/infra/02-network

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

  network-plan:
    name: 02 - network plan
    runs-on: ubuntu-latest
    needs: network-validate

    defaults:
      run:
        working-directory: diplom/infra/02-network

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan


  # =========================
  # 03 - K8S
  # =========================

  k8s-init:
    name: 03 - k8s init
    runs-on: ubuntu-latest
    needs: network-plan

    defaults:
      run:
        working-directory: diplom/infra/03-k8s

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Export vars
        run: |
          echo "TF_VAR_cloud_id=${{ secrets.YC_CLOUD_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_folder_id=${{ secrets.YC_FOLDER_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_token=${{ secrets.YC_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV

      - run: terraform init

  k8s-validate:
    name: 03 - k8s validate
    runs-on: ubuntu-latest
    needs: k8s-init

    defaults:
      run:
        working-directory: diplom/infra/03-k8s

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Export vars
        run: |
          echo "TF_VAR_cloud_id=${{ secrets.YC_CLOUD_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_folder_id=${{ secrets.YC_FOLDER_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_token=${{ secrets.YC_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

  k8s-plan:
    name: 03 - k8s plan
    runs-on: ubuntu-latest
    needs: k8s-validate

    defaults:
      run:
        working-directory: diplom/infra/03-k8s

    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Export vars
        run: |
          echo "TF_VAR_cloud_id=${{ secrets.YC_CLOUD_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_folder_id=${{ secrets.YC_FOLDER_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_token=${{ secrets.YC_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV

      - run: terraform init
      - run: terraform plan