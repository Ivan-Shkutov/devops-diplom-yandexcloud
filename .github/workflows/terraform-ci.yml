name: Terraform CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:

  # 1. Checkout repository
  checkout:
    name: 01 - Checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  # 2. Setup Terraform
  setup:
    name: 02 - Setup Terraform
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

  # 3. Terraform format check
  fmt:
    name: 03 - Terraform fmt
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Terraform fmt
        run: terraform fmt -check

  # 4. Terraform init
  init:
    name: 04 - Terraform init
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4

      - name: Terraform init
        run: terraform init

  # 5. Terraform validate
  validate:
    name: 05 - Terraform validate
    runs-on: ubuntu-latest
    needs: init
    steps:
      - uses: actions/checkout@v4

      - name: Export variables
        run: |
          echo "TF_VAR_cloud_id=${{ secrets.YC_CLOUD_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_folder_id=${{ secrets.YC_FOLDER_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_token=${{ secrets.YC_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV

      - name: Terraform validate
        run: terraform validate

  # 6. Terraform plan
  plan:
    name: 06 - Terraform plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Export variables
        run: |
          echo "TF_VAR_cloud_id=${{ secrets.YC_CLOUD_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_folder_id=${{ secrets.YC_FOLDER_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_token=${{ secrets.YC_TOKEN }}" >> $GITHUB_ENV
          echo "TF_VAR_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" >> $GITHUB_ENV

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan