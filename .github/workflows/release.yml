name: Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image (versioned)
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ env.VERSION }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}/app:${{ env.VERSION }}

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig
          export KUBECONFIG=kubeconfig

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/app app=ghcr.io/${{ github.repository }}/app:${{ env.VERSION }}
          kubectl rollout status deployment/app