name: Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:

  # 1. Get version
  version:
    name: 01 - Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Extract tag
        id: setver
        run: |
          VERSION=${GITHUB_REF_NAME}
          echo "version=$VERSION" >> $GITHUB_OUTPUT


  # 2. Build + Push (ОДИН JOB — важно!)
  build-and-push:
    name: 02 - Build & Push Image
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }} ./diplom/test-app

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}


  # 3. Deploy to Kubernetes
  deploy:
    name: 03 - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy image
        run: |
          kubectl set image deployment/nginx-image \
            nginx-image=${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/nginx-image


  # 4. Verify via bastion
  verify:
    name: 04 - Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: SSH check cluster
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            kubectl get nodes -o wide
            kubectl get pods
            kubectl get svc
            kubectl rollout status deployment/nginx-image