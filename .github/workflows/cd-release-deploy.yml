name: Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:

  # 1. Checkout
  checkout:
    name: 01 - Checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  # 2. Extract version from tag
  version:
    name: 02 - Extract Version
    runs-on: ubuntu-latest
    needs: checkout
    outputs:
      version: ${{ steps.setver.outputs.version }}
    steps:
      - name: Set version
        id: setver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # 3. Build Docker image
  build:
    name: 03 - Build Image
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }} ./diplom/test-app

  # 4. Push Docker image
  push:
    name: 04 - Push Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}

  # 5. Deploy to Kubernetes
  deploy:
    name: 05 - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy new image
        run: |
          kubectl set image deployment/nginx-image \
            nginx-image=${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/nginx-image

  # 6. Verify deployment via bastion
  verify:
    name: 06 - Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: SSH to Kubernetes master via bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "=== Cluster state ==="
            kubectl get nodes -o wide

            echo "=== Pods ==="
            kubectl get pods

            echo "=== Services ==="
            kubectl get svc

            echo "=== Rollout status ==="
            kubectl rollout status deployment/nginx-image