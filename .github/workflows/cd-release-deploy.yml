name: CI/CD Pipeline (Release + Deploy)

on:
  push:
    tags:
      - "v*"

jobs:

  # 1. Checkout
  checkout:
    name: 01 - Checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


  # 2. Extract version
  version:
    name: 02 - Extract Version
    runs-on: ubuntu-latest
    needs: checkout
    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Set version
        id: setver
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT


  # 3. Build & Push Docker image
  build_and_push:
    name: 03 - Build & Push
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }} ./diplom/test-app

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}


  # 4. Deploy via Bastion -> Master
  deploy:
    name: 04 - Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy via bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}     # 93.77.182.164
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            VERSION=${GITHUB_REF#refs/tags/}

            echo "Deploying version: $VERSION"

            ssh ubuntu@10.10.0.3 "
              kubectl set image deployment/nginx-image \
                nginx-image=${{ secrets.DOCKER_USERNAME }}/app:$VERSION

              kubectl rollout status deployment/nginx-image
              kubectl get pods
              kubectl get svc
            "


  # 5. Verify cluster state
  verify:
    name: 05 - Verify
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Final verification via bastion
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            ssh ubuntu@10.10.0.3 "kubectl get nodes -o wide"
            ssh ubuntu@10.10.0.3 "kubectl get pods"
            ssh ubuntu@10.10.0.3 "kubectl get svc"
            ssh ubuntu@10.10.0.3 "kubectl rollout status deployment/nginx-image"