name: CD - Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:

  # =========================
  # 1. Get Version
  # =========================

  version:
    name: 01 - Get Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # =========================
  # 2. Build and Push Docker Image
  # =========================

  docker:
    name: 02 - Build & Push Docker
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }} \
            ./diplom/test-app

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}

  # =========================
  # 3. Release Information
  # =========================

  release-info:
    name: 03 - Release Information
    runs-on: ubuntu-latest
    needs:
      - version
      - docker

    steps:
      - name: Show release info
        run: |
          echo "Release completed successfully"
          echo "Version: ${{ needs.version.outputs.version }}"
          echo "Docker image:"
          echo "${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}"

  # =========================
  # 4. Kubernetes Deploy Instructions
  # =========================

  deploy-info:
    name: 04 - Kubernetes Deploy Info
    runs-on: ubuntu-latest
    needs: release-info

    steps:
      - name: Show deploy command
        run: |
          echo "Deploy manually on Kubernetes master:"
          echo ""
          echo "ssh -J ubuntu@${{ secrets.SSH_HOST }} ubuntu@10.10.0.3"
          echo ""
          echo "kubectl set image deployment/nginx-image nginx-image=${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}"
          echo ""
          echo "kubectl rollout status deployment/nginx-image"

  # =========================
  # 5. Final Status
  # =========================
  
  finish:
    name: 05 - Pipeline Finished
    runs-on: ubuntu-latest
    needs: deploy-info

    steps:
      - name: Pipeline status
        run: |
          echo "CI/CD pipeline finished successfully"