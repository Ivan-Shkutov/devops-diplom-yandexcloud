name: Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:

  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build versioned image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app:${{ env.VERSION }} ./diplom/test-app

      - name: Push versioned image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app:${{ env.VERSION }}

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/app app=${{ secrets.DOCKER_USERNAME }}/app:${{ env.VERSION }}
          kubectl rollout status deployment/app
          