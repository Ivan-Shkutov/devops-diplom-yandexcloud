name: CD - Release & Deploy

on:
  push:
    tags:
      - "v*"

jobs:

  # 1. Get Version
  version:
    name: 01 - Get Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT


  # 2. Build and Push Docker Image
  docker:
    name: 02 - Build & Push Docker
    runs-on: ubuntu-latest
    needs: version

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }} \
            ./diplom/test-app

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}


  # 3. Deploy to Kubernetes
  deploy:
    name: 03 - Deploy Kubernetes
    runs-on: ubuntu-latest
    needs:
      - version
      - docker

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -o StrictHostKeyChecking=no \
              -J ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              ubuntu@10.10.0.3 "
          
          kubectl set image deployment/nginx-image \
          nginx-image=${{ secrets.DOCKER_USERNAME }}/app:${{ needs.version.outputs.version }}

          kubectl rollout status deployment/nginx-image
          "


  # 4. Verify Deployment
  verify:
    name: 04 - Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Verify cluster
        run: |
          ssh -o StrictHostKeyChecking=no \
              -J ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              ubuntu@10.10.0.3 "
          
          echo '=== Nodes ==='
          kubectl get nodes

          echo '=== Pods ==='
          kubectl get pods

          echo '=== Services ==='
          kubectl get svc
          "