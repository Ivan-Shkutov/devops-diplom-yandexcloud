name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:

  # ======================
  # 1. CI CHECK
  # ======================
  ci:
    name: CI - Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Dockerfile structure check
        run: |
          echo "Checking project structure..."
          ls -la diplom/test-app

  # ======================
  # 2. BUILD IMAGE
  # ======================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/app:latest ./diplom/test-app

  # ======================
  # 3. PUSH IMAGE
  # ======================
  push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/app:latest